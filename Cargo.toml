[workspace]
resolver = "2"
members = [
    "crates/luanalysis",
    "crates/luanalysis-syntax",
    "crates/luanalysis-engine",
    "crates/luanalysis-fixtures",
    "crates/luanalysis-project",
    "crates/luanalysis-ffi",
]
exclude = ["vendor/bun"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
luanalysis-syntax = { path = "crates/luanalysis-syntax" }
luanalysis-engine = { path = "crates/luanalysis-engine" }
luanalysis-project = { path = "crates/luanalysis-project" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Keep routine development and test artifacts bounded. Full variable-level
# debug information can be requested explicitly for a focused investigation.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false
