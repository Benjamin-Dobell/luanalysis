# Generated by scripts/vendor-bun.py; see provenance.json for exact adaptations.
[workspace]
resolver = "2"
members = ["src/bun_alloc", "src/bun_core", "src/bun_core_macros", "src/bun_output_tags", "src/collections", "src/dispatch", "src/errno", "src/hash", "src/highway", "src/libuv_sys", "src/mimalloc_sys", "src/opaque", "src/paths", "src/ptr", "src/safety", "src/sema", "src/simdutf_sys", "src/sys", "src/threading", "src/windows_sys", "src/wyhash", "src/zstd"]

[workspace.package]
version = "0.0.0"
edition = "2024"

[workspace.lints.rust]
