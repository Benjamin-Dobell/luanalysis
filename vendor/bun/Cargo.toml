scopeguard = "1"
const_format = "0.2"
enum-map = "2"
libc = "0.2"
rustix = { version = "0.38", default-features = false, features = ["std", "fs", "event", "process", "net"] }
bitflags = "2"
thiserror = "2"
smallvec = "1"
itoa = "1"
bun_opaque = { path = "src/opaque" }
