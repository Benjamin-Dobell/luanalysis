name: Build

# The command line tool and the shared and static libraries (with luanalysis.h) for Linux, macOS
# and Windows, on x86-64 and ARM64, each built and smoke-tested on its own architecture. Linux
# tools are static musl executables; Linux libraries are built in manylinux_2_28 containers, so
# any process with glibc 2.28 or later can load them. macOS archives are universal (lipo).
# Archives are built with the `dist` profile (whole-program optimisation, no symbol table). Each
# static library is linked by path in a smoke test, with the system libraries rustc reports.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # actions/checkout runs `git init`; naming the initial branch leaves git nothing to advise.
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    defaults:
      run:
        shell: bash
    env:
      # A compiler warning on any platform fails the build.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" \
            --profile minimal --target ${{ matrix.arch }}-unknown-linux-musl
      - name: Command line tool (static musl)
        run: cargo build --locked --profile dist -p luanalysis --target ${{ matrix.arch }}-unknown-linux-musl
      - name: Libraries
        run: |
          cargo rustc --locked --profile dist -p luanalysis-ffi --lib -- --print native-static-libs 2> libraries.log \
            || { cat libraries.log; exit 1; }
          cat libraries.log
          sed -n 's/^note: native-static-libs: //p' libraries.log > target/dist/native-static-libs.txt
      - name: Package
        run: |
          out=luanalysis-linux-${{ matrix.arch }}
          mkdir -p $out/bin $out/lib $out/include
          cp target/${{ matrix.arch }}-unknown-linux-musl/dist/luanalysis-cli $out/bin/luanalysis
          cp target/dist/libluanalysis.so target/dist/libluanalysis.a $out/lib/
          cp crates/luanalysis-ffi/include/luanalysis.h $out/include/
          cp README.md LICENSE $out/
          tar czf $out.tar.gz $out
      - name: Smoke test
        run: |
          out=luanalysis-linux-${{ matrix.arch }}
          printf 'local x = 1\n' > smoke.lua
          $out/bin/luanalysis --version
          $out/bin/luanalysis check --lua-version 5.4 smoke.lua
          cc -I$out/include crates/luanalysis-ffi/examples/smoke.c -L$out/lib -lluanalysis -Wl,-rpath,'$ORIGIN/'$out/lib -o smoke
          ./smoke smoke.lua
          cc -I$out/include crates/luanalysis-ffi/examples/smoke.c $out/lib/libluanalysis.a $(cat target/dist/native-static-libs.txt) \
            -o smoke-static
          ./smoke-static smoke.lua
          echo "Newest glibc symbol the library needs:"
          objdump -T $out/lib/libluanalysis.so | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - uses: actions/upload-artifact@v7
        with:
          name: luanalysis-linux-${{ matrix.arch }}
          path: luanalysis-linux-${{ matrix.arch }}.tar.gz

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: macos-15-intel }
          - { arch: aarch64, runner: macos-15 }
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          cargo build --locked --profile dist -p luanalysis
          cargo rustc --locked --profile dist -p luanalysis-ffi --lib -- --print native-static-libs 2> libraries.log \
            || { cat libraries.log; exit 1; }
          cat libraries.log
          # clang links libSystem itself; naming it again makes ld warn about a duplicate.
          sed -n 's/^note: native-static-libs: //p' libraries.log | sed 's/ *-lSystem//' > target/dist/native-static-libs.txt
      - name: Smoke test
        run: |
          printf 'local x = 1\n' > smoke.lua
          target/dist/luanalysis-cli --version
          target/dist/luanalysis-cli check --lua-version 5.4 smoke.lua
          cc -Icrates/luanalysis-ffi/include crates/luanalysis-ffi/examples/smoke.c -Ltarget/dist -lluanalysis \
            -Wl,-rpath,@executable_path/target/dist -o smoke
          ./smoke smoke.lua
          cc -Icrates/luanalysis-ffi/include crates/luanalysis-ffi/examples/smoke.c target/dist/libluanalysis.a \
            $(cat target/dist/native-static-libs.txt) -o smoke-static
          ./smoke-static smoke.lua
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: |
            target/dist/luanalysis-cli
            target/dist/libluanalysis.dylib
            target/dist/libluanalysis.a
            target/dist/native-static-libs.txt

  macos-universal:
    name: macOS universal
    needs: macos
    runs-on: macos-15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      # gh rather than actions/download-artifact, which prints a Node deprecation on every
      # download (actions/download-artifact#484).
      - name: Download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ github.run_id }} --name macos-x86_64 --dir x86_64
          gh run download ${{ github.run_id }} --name macos-aarch64 --dir aarch64
      - name: Package
        run: |
          out=luanalysis-macos-universal
          mkdir -p $out/bin $out/lib $out/include
          lipo -create -output $out/bin/luanalysis x86_64/luanalysis-cli aarch64/luanalysis-cli
          lipo -create -output $out/lib/libluanalysis.dylib x86_64/libluanalysis.dylib aarch64/libluanalysis.dylib
          lipo -create -output $out/lib/libluanalysis.a x86_64/libluanalysis.a aarch64/libluanalysis.a
          chmod +x $out/bin/luanalysis
          cp crates/luanalysis-ffi/include/luanalysis.h $out/include/
          cp README.md LICENSE $out/
          lipo -info $out/bin/luanalysis $out/lib/libluanalysis.dylib $out/lib/libluanalysis.a
          tar czf $out.tar.gz $out
      - name: Smoke test
        run: |
          out=luanalysis-macos-universal
          printf 'local x = 1\n' > smoke.lua
          $out/bin/luanalysis check --lua-version 5.4 smoke.lua
          cc -I$out/include crates/luanalysis-ffi/examples/smoke.c -L$out/lib -lluanalysis \
            -Wl,-rpath,@executable_path/$out/lib -o smoke
          ./smoke smoke.lua
          cc -I$out/include crates/luanalysis-ffi/examples/smoke.c $out/lib/libluanalysis.a \
            $(cat aarch64/native-static-libs.txt) -o smoke-static
          ./smoke-static smoke.lua
      - uses: actions/upload-artifact@v7
        with:
          name: luanalysis-macos-universal
          path: luanalysis-macos-universal.tar.gz

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: windows-2022, vcvars: vcvars64.bat }
          - { arch: aarch64, runner: windows-11-arm, vcvars: vcvarsarm64.bat }
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          cargo build --locked --profile dist -p luanalysis
          cargo rustc --locked --profile dist -p luanalysis-ffi --lib -- --print native-static-libs 2> libraries.log \
            || { cat libraries.log; exit 1; }
          cat libraries.log
          sed -n 's/^note: native-static-libs: //p' libraries.log > target/dist/native-static-libs.txt
      - name: Package
        run: |
          out=luanalysis-windows-${{ matrix.arch }}
          mkdir -p $out/bin $out/lib $out/include
          cp target/dist/luanalysis-cli.exe $out/bin/luanalysis.exe
          cp target/dist/luanalysis.dll $out/bin/
          cp target/dist/luanalysis.dll.lib target/dist/luanalysis.lib $out/lib/
          cp crates/luanalysis-ffi/include/luanalysis.h $out/include/
          cp README.md LICENSE $out/
          7z a $out.zip $out
      - name: Smoke test
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set vs=%%i
          call "%vs%\VC\Auxiliary\Build\${{ matrix.vcvars }}"
          set out=luanalysis-windows-${{ matrix.arch }}
          > smoke.lua echo local x = 1
          %out%\bin\luanalysis.exe --version || exit /b 1
          %out%\bin\luanalysis.exe check --lua-version 5.4 smoke.lua || exit /b 1
          cl /nologo /I%out%\include crates\luanalysis-ffi\examples\smoke.c /link %out%\lib\luanalysis.dll.lib /OUT:smoke.exe || exit /b 1
          copy %out%\bin\luanalysis.dll . || exit /b 1
          smoke.exe smoke.lua || exit /b 1
          set /p nativelibs=<target\dist\native-static-libs.txt
          cl /nologo /MT /I%out%\include /Fosmoke-static.obj crates\luanalysis-ffi\examples\smoke.c /link %out%\lib\luanalysis.lib %nativelibs% /OUT:smoke-static.exe || exit /b 1
          smoke-static.exe smoke.lua || exit /b 1
      - uses: actions/upload-artifact@v7
        with:
          name: luanalysis-windows-${{ matrix.arch }}
          path: luanalysis-windows-${{ matrix.arch }}.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, linux, macos-universal, windows]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download ${{ github.run_id }} --pattern 'luanalysis-*' --dir artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*/*
